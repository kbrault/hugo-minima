{{ define "main" }}
<div class="post">

  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
      <p class="meta">{{ .Date.Format "January 2, 2006" }}</p>
    {{ end }}
  </header>

  <article class="post-content">
    {{ .Content }}
  </article>

</div>

{{ if eq .Kind "section" }}
<ul class="posts">
  {{ range .Pages }}
  <li>
    <div class="post">
      {{ if not .Date.IsZero }}<span class="post-date">{{ .Date.Format "Jan 02, 2006" }}</span>{{ end }}
      <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
    </div>
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
